# HuShield marketing site. TLS terminates here; the Go service binds
# 127.0.0.1:8081 and is never directly reachable.
# Install: /etc/nginx/conf.d/hushield-web.conf

server {
    listen 80;
    listen [::]:80;
    server_name hushield.com www.hushield.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://hushield.com$request_uri; }
}

# Canonicalize www -> apex so the contributor graph and analytics-free stats
# aren't split across two hostnames.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hushield.com;
    ssl_certificate     /etc/letsencrypt/live/hushield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hushield.com/privkey.pem;
    return 301 https://hushield.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hushield.com;

    ssl_certificate     /etc/letsencrypt/live/hushield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hushield.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The site loads no third-party anything -- no CDN, no fonts, no analytics.
    # A strict CSP is therefore free, and enforcing it keeps it that way.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' https://avatars.githubusercontent.com; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css text/html application/json image/svg+xml;
    gzip_min_length 512;

    access_log /var/log/nginx/hushield-web.access.log;
    error_log  /var/log/nginx/hushield-web.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
